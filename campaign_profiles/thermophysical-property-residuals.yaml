    - "Can the esters/lactones negative/control package pass Gate A while preserving aggregate-positive context?"
  curator_review:
    status: current
    last_reviewed: "2026-07-05"
    review_interval: quarterly_active
    next_review_due: "2026-09-01"
    review_reason: benchmark_monitoring
    source: "TASK-0907 formal Gate B bridge, TASK-0918 negative-result preflight, TASK-0895 source-expansion preflight, and Scientific Director 2026-07-05 task-queue cycle"
    notes: "This bounded thermophysical-property benchmark lane stays Tb-only and no-claim. RESULT-0026 is AGENT_VALIDATED; next useful work is failed-family negative packaging plus a source-rights decision packet, not another Joback run."
