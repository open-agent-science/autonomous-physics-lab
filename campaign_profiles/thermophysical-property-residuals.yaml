      label: "Keep the bounded 80-row extract blocked until the pinned local archive or a revised source-access contract exists"
    - task_id: null
      label: "Optionally plan a Gate-B-safe RESULT-0028 replay or a revised expansion contract; do not rerun Joback as a new result"
  required_gates:
    - "ThermoML archive DOI, checksum, and rights boundary must stay explicit."
    - "No raw archive bytes or substantial normalized corpus may be committed."
    - "Tb-only scope unless a future task separately gates another property."
    - "Implementation-fidelity fixture must pass before benchmark metrics matter."
    - "Aggregate wins must be reported with per-family survival and failed-family memory."
  current_results:
