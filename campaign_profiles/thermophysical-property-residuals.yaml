  open_questions:
    - "Will the checksum-matching ThermoML archive be supplied locally for the bounded extract, or should the source-access contract change?"
    - "Can RESULT-0028 be replayed through a Gate-B-safe route without mutating RESULT-0026?"
  curator_review:
    status: current
    last_reviewed: "2026-07-09"
    review_interval: quarterly_active
    next_review_due: "2026-09-01"
    review_reason: benchmark_monitoring
    source: "TASK-0907 formal Gate B bridge, TASK-0936 RESULT-0028 packaging, TASK-0955 source blocker, and Scientific Director 2026-07-09 docs-sync cycle"
    notes: "This bounded thermophysical-property benchmark lane stays Tb-only and no-claim. RESULT-0026 is AGENT_VALIDATED, RESULT-0028 preserves failed-family memory, and expansion is source-access/revised-contract gated."
