id: dimensional-analysis-validator
title: "Dimensional analysis validator"
autonomy_status: WHITELISTED_LIMITED
pilot_rank: 2

source_docs:
  - docs/campaigns/dimensional-analysis-validator.md
  - docs/results/dimensional-analysis-validator-summary.md
  - docs/notes/dimensional-analysis-challenge-set.md
  - docs/autonomous-research-loop.md
  - docs/research-quality-gate.md

allowed_hypothesis_families:
  - "Challenge-entry proposals with explicit expected dimensional verdicts."
  - "Known-limit or semantic-suspicion examples with clear rationale."
  - "Validator limitation probes that do not rewrite the frozen MVP result."

allowed_experiment_families:
  - "Sandbox classification of proposed formulas."
  - "Comparison of expected and observed validator verdicts."
  - "Ambiguity notes for SUSPICIOUS or KNOWN_LIMIT_FAIL cases."
  - "Follow-up benchmark rebaseline proposals."

required_inputs:
  - "Formula expression."
  - "Variable dimension map."
  - "Expected verdict."
  - "Rationale for expected verdict."
  - "Reference to the current challenge set or result summary."

required_quality_checks:
  - "Do not change frozen RESULT-0007 replay scope."
  - "Separate live curation examples from canonical MVP metrics."
  - "State whether the example is SI-focused or outside current scope."
  - "State why dimensional consistency is or is not enough for the example."
  - "Run the shared research quality gate before PR handoff."

forbidden_claims:
  - "Dimensional consistency proves full physical correctness."
  - "Live challenge additions update RESULT-0007 metrics."
  - "Natural-unit workflows are supported unless explicitly scoped."
  - "Sandbox classification is a canonical benchmark rebaseline."

sandbox_permissions:
  may_create:
    - hypothesis_proposals
    - experiment_proposals
    - scoped_notes
    - temporary_outputs
  must_not_edit:
    - claims
    - canonical_results
    - frozen_mvp_replay_inputs

validation_commands:
  - "python3 -m ruff check ."
  - "python3 -m pytest"
  - "python3 -m physics_lab.cli validate-repo ."
  - "python3 -m physics_lab.cli validate-repo . --strict --fail-on-warnings"

handoff_requires:
  - task_id_or_microtask_id
  - campaign_profile_id
  - proposal_path
  - formula
  - expected_verdict
  - observed_verdict
  - limitation
  - verdict
  - maintainer_decision_requested

portfolio:
  status: quality_floor
  domain: physics_validation
  surface_type: quality_floor
  lifecycle_stage: mature
  activity_status: active_support
  curator:
    primary_pool: verifier_quality_floor
    secondary_pools:
      - result_promotion
    review_cadence: as_needed
    transfer_requires:
      - scientific_director_or_maintainer_pr
      - curator_cycle_review
      - updated_campaign_profile
  current_stage: "RESULT-0007 and AGENT_VALIDATED RESULT-0020 are historical calibration/regression memory. RESULT-0030 is AGENT_PUBLISHED after the frozen 80-item label_blind_exact_v2 surface scored 80/80 exact agreement, 100% VALID and INVALID recall, and 0% INCONCLUSIVE; same-owner role separation limits it to calibration rather than confirmatory CLAIM-0005 evidence."
  recommended_parallel_agents: 2
  coordination_notes: "TASK-1062 may independently replay RESULT-0030 while TASK-1071 is reserved for a genuinely external human-controlled curator to freeze a new no-score benchmark. These surfaces are disjoint. Do not use the same-owner v2 result to reopen CLAIM-0005 Gate C."
  next_validity_gate:
    type: ratification
    blocker: "RESULT-0030 still needs independent Gate B replay, and confirmatory generalization remains blocked until a genuinely external human authors a fresh blind benchmark without validator exposure."
    target_artifact: "TASK-1062 and TASK-1071"
  best_next_actions:
    - task_id: TASK-1062
      label: "Replay RESULT-0030 under a genuinely independent human identity while preserving the calibration-only ceiling"
    - task_id: TASK-1071
      label: "Freeze a genuinely external blind benchmark without scoring it"
  required_gates:
    - "Do not change frozen RESULT-0007 replay scope."
    - "Separate live curation from canonical MVP metrics."
  current_results:
    - "results/EXP-0006/RUN-0006/result.yaml"
    - "results/EXP-0006/RUN-0007/result.yaml"
    - "docs/results/dimensional-analysis-validator-summary.md"
    - "docs/reviews/dimensional-result-0020-gate-b-contested-replay.md"
    - "docs/reviews/dimensional-result0020-gateb-adjudication-brief.md"
    - "docs/reviews/dimensional-result-0020-gate-b-packaging-adjudication.md"
    - "docs/reviews/dimensional-result-0020-gate-b-validation-independence-blocker.md"
    - "tasks/TASK-1038-dimensional-validator-scoring-separation.yaml"
    - "tasks/TASK-1039-dimensional-validator-v2-role-disjoint-benchmark-freeze.yaml"
    - "knowledge/challenge_sets/dimensional_analysis_challenge_set_v2.yaml"
    - "results/EXP-0006/RUN-0008/result.yaml"
  open_questions:
    - "Can an independent human replay reproduce RESULT-0030 exactly while preserving its calibration-only interpretation?"
    - "Can a different human curate a fresh blind surface that is independent enough for a later one-shot generalization test?"
  curator_review:
    status: current
    last_reviewed: "2026-07-17"
    review_interval: semiannual_quality_floor
    next_review_due: "2026-12-01"
    review_reason: quality_floor_hygiene
    source: "RESULT-0030, TASK-1062, and Scientific Director 2026-07-17 cycle"
    notes: "The 80-item exact-v2 calibration passed every frozen threshold and needs independent Gate B replay. A separate externally authored no-score surface is the honest route to a future generalization test."
