    - scoped_notes
    - metadata_only_source_manifests
    - temporary_outputs
  must_not_edit:
    - claims
    - canonical_results
    - registered_prediction_payloads
    - reveal_labels

validation_commands:
  - "python3 -m ruff check ."
  - "python3 -m pytest"
  - "python3 -m physics_lab.cli validate-repo . --strict --fail-on-warnings"

handoff_requires:
