allowed_hypothesis_families:
  - "No new model family while PRED-0001 is registered and unrevealed."
  - "Metadata-only reveal-source, alias, rights, checksum, and no-peek readiness work."
  - "Negative, null, or inconclusive reveal-memory planning under the frozen comparison contract."

allowed_experiment_families:
  - "No reveal scoring until a checksum-pinned source manifest is separately approved by the maintainer."
  - "Deterministic archive/reduced-capsule packaging that does not alter the registered prediction."

required_inputs:
  - "Registered prediction_registry/radio_transients/PRED-0001.yaml identity and payload digest."
  - "TASK-0995 reveal-source admissibility contract and no-label boundary."
  - "Source release date, version, rights, checksum, and repeat-evidence timestamp semantics before label read."
  - "Maintainer approval before reveal-source ingestion or scoring."

required_quality_checks:
  - "Do not read repeat labels or timestamps before the reveal manifest freezes."
  - "Do not alter scores, ranks, target ids, comparators, or the T=2019-07-02 split."
  - "Keep source-state non-repeat labels distinct from permanent non-repeater claims."
  - "Preserve null, negative, partial, and inconclusive reveal outcomes."

forbidden_claims:
  - "PRED-0001 is a successful predictor before a maintainer-reviewed reveal."
  - "The exposure score is a calibrated probability."
  - "The registered surface establishes FRB population, morphology, or repeater physics."
  - "Packaging or external anchoring is a scientific reveal result."

