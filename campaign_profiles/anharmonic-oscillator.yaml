id: anharmonic-oscillator
title: "Anharmonic oscillator benchmark"
autonomy_status: WHITELISTED_LIMITED
pilot_rank: 3

source_docs:
  - docs/results/anharmonic-oscillator-summary.md
  - docs/drafts/anharmonic-period-experiment-plan.md
  - docs/autonomous-research-loop.md
  - docs/research-quality-gate.md

allowed_hypothesis_families:
  - "Epsilon-based ratio candidates evaluated on the EXP-0011 train, holdout, and stress slices."
  - "Negative-control candidates that intentionally collapse one benchmark axis."
  - "Breakdown-mapping probes that remain scoped to approximation quality only."

allowed_experiment_families:
  - "Deterministic replay of the EXP-0011 anharmonic reference surface."
  - "Train-fit and holdout comparison against the RESULT-0014 canonical baseline."
  - "Sandbox-only contrast between one promising candidate and one negative-control candidate."

required_inputs:
  - "EXP-0011 train, holdout, and stress slice definitions."
  - "Candidate formula specification with named variables and fit parameters."
  - "Exact-reference or deterministic-integral baseline path."
  - "Reference to RESULT-0014 when claiming relative improvement inside sandbox only."

required_quality_checks:
  - "State that no exactness or broad-range claim is made."
  - "Report train, holdout, and stress relative error metrics."
  - "State why rejected proposals were not executed."
  - "Keep all evidence under proposal or agent-run paths only."
  - "Run the shared research quality gate before PR handoff."

forbidden_claims:
  - "A sandbox candidate replaces RESULT-0014 automatically."
  - "A train-fitted candidate is a discovered physical law."
  - "A sandbox fit is exact or valid for all anharmonicities."
  - "Negative-control failure means the benchmark itself is invalid."

sandbox_permissions:
  may_create:
    - hypothesis_proposals
    - experiment_proposals
    - scoped_notes
    - temporary_outputs
  must_not_edit:
    - claims
    - canonical_hypotheses
    - canonical_experiments
    - canonical_results
    - knowledge

validation_commands:
  - "python3 -m ruff check ."
  - "python3 -m pytest"
  - "python3 -m physics_lab.cli validate-repo ."
  - "python3 -m physics_lab.cli validate-repo . --strict --fail-on-warnings"

handoff_requires:
  - task_id_or_microtask_id
  - campaign_profile_id
  - hypothesis_proposal_path
  - experiment_proposal_path
  - method
  - metrics
  - limitations
  - verdict
  - maintainer_decision_requested

portfolio:
  status: quality_floor
  domain: classical_mechanics
  surface_type: quality_floor
  lifecycle_stage: mature
  activity_status: active_support
  curator:
    primary_pool: verifier_quality_floor
    secondary_pools:
      - result_promotion
    review_cadence: as_needed
    transfer_requires:
      - scientific_director_or_maintainer_pr
      - curator_cycle_review
      - updated_campaign_profile
  current_stage: "RESULT-0016 is AGENT_VALIDATED range-limited calibration memory, and CLAIM-0009 is PARTIALLY_SUPPORTED at MAINTAINER_REVIEWED with calibration_known_physics / calibration_memory classification."
  recommended_parallel_agents: 0
  coordination_notes: "The quality-floor and Gate C paths are complete. Use only for maintainer-requested regression maintenance or genuinely new external evidence; avoid broad candidate expansion, duplicate handoffs, or novelty wording."
  next_validity_gate:
    type: transfer
    blocker: "No active transfer is planned; the campaign is mature calibration memory and reopens only for genuinely new external evidence."
    target_artifact: "claims/CLAIM-0009-anharmonic-oscillator-period.md"
  best_next_actions:
    - task_id: null
      label: "Keep as mature calibration memory; reopen only for genuinely new external evidence or a maintainer-requested regression"
  required_gates:
    - "Train, holdout, and stress metrics must remain separated."
    - "No exactness or broad-range wording."
  current_results:
    - "results/EXP-0011/RUN-0002/result.yaml"
    - "claims/CLAIM-0009-anharmonic-oscillator-period.md"
    - "docs/results/anharmonic-oscillator-summary.md"
    - "docs/reviews/first-agent-validated-replay.md"
    - "docs/reviews/claim-0009-anharmonic-evidence-handoff.md"
  open_questions: []
  curator_review:
    status: current
    last_reviewed: "2026-07-25"
    review_interval: semiannual_quality_floor
    next_review_due: "2026-12-01"
    review_reason: quality_floor_hygiene
    source: "RESULT-0016, CLAIM-0009 maintainer Gate C record, and Scientific Director 2026-07-25 cycle"
    notes: "Gate C is complete and the claim remains explicitly calibration memory. No executor task is warranted without a new maintainer-requested regression or external evidence route."
