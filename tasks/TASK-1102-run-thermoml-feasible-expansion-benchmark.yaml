id: TASK-1102
title: "Run the frozen ThermoML feasible-expansion benchmark once"
type: scientific_result_publication
status: BLOCKED
closeout: review
closeout_review_reason: "This task may create the expanded ThermoML result; closeout must verify fixture readiness, unchanged TASK-1084 contract, fixed controls, family-equal weighting, rights scope, and no rescue analysis."
difficulty: high
priority: high

strategy_alignment:
  - "TASK-1084 froze the availability-capped, family-equal contract and TASK-1091 is the separate source-fixture extraction gate."
  - "A one-shot benchmark can test whether the earlier Joback transfer survives up to 74 source-pinned rows without threshold or model shopping."
  - "PASS, control-dominated FAIL, and family-dependent INCONCLUSIVE are all durable scientific outputs."

input:
  mode: workflow
  related_domain: thermophysical_property_estimation
  related_objects:
    - "tasks/TASK-1091-extract-thermoml-tb-feasible-expansion-fixture.yaml"
    - "data/thermophysical/thermoml_tb_feasible_expansion_contract.yaml"
    - "docs/reviews/thermoml/thermoml-tb-feasible-expansion-contract-task1084.md"
    - "results/EXP-0020/RUN-0001/result.yaml"
    - "results/EXP-0020/RUN-0002/result.yaml"
  planning_context: >
    Execute exactly the TASK-1084 frozen benchmark after TASK-1091 produces a
    complete passing fixture. Extraction and scoring remain separate; no
    partial fixture or post-score contract change is allowed.

requirements:
  - "Blocked-by: merged TASK-1091 with a PASS fixture that satisfies every archive, rights, article-cap, family, identity, and information-floor gate, plus canonical fixture/release hashes on main."
  - "Before scoring, verify the fixture and contract hashes, at most 74 rows, at least 64 rows, at least 24 new identities, all eight families, conflict exclusions, five-row article cap, and equal-family effective-row floor; stop on any drift."
  - "Use only the fixed Joback Tb estimator, eight leave-one-family-out folds, family weight 1/8, within-family row weight 1/n_family, global median, molecular-weight-only, nearest-homolog, shuffled-group-count, and within-family-constant controls from TASK-1084."
  - "Preserve shuffle seed 851, 5 K survival margin, six-of-eight family rule, and the exact PASS_TRANSFER_SUPPORTED_IN_SCOPE / FAIL_CONTROL_DOMINATED / INCONCLUSIVE_FAMILY_DEPENDENT routing."
  - "Report complete aggregate and per-family metrics, control comparisons, retained-versus-new identity counts, sensitivity/failure cases, rights limitations, and the historical RESULT-0026/0028 comparison as secondary context only."
  - "Do not change thresholds, caps, families, weights, estimator, controls, splits, rows, conflict handling, or source after scores become visible; do not run a rescue model or select a favorable subgroup."
  - "Create an AGENT_PUBLISHED RESULT candidate only if deterministic code, provenance, controls, limitations, verification, and Gate A pass; otherwise preserve the exact blocker without a partial result."
  - "No-claim wording: this is a bounded pure-component normal-boiling-temperature benchmark, not universal Joback validation, chemical design/process/safety guidance, or evidence about other thermophysical properties."

accepted_outputs:
  - "A deterministic expanded ThermoML benchmark workflow, frozen inputs, tests, complete metric/control ledger, limitations, and exactly one contract verdict."
  - "A scoped RESULT candidate and Gate A report only on publication-gate PASS; otherwise a durable no-publication blocker."
  - "Output routing covering Gate A/B, relation to RESULT-0026/0028, claim/knowledge impact, rights ceiling, and campaign stop/go recommendation."

result_artifact_policy:
  required: true
  reason: "This task exists to preserve the frozen expanded ThermoML PASS, FAIL, or INCONCLUSIVE outcome as a canonical scoped result when Gate A passes."
  evidence:
    - "results/EXP-*/RUN-*/result.yaml"

validation:
  commands:
    - "python3 -m ruff check ."
    - "python3 -m pytest -n0 tests/test_thermoml_tb_feasible_expansion_contract.py tests/test_thermoml_family_transfer.py tests/test_result_publication_gate.py tests/test_data_redistribution_declarations.py tests/test_docs_links.py"
    - "python3 -m physics_lab.cli validate-repo . --strict --fail-on-warnings"
    - "git diff --check"

can_be_done_by:
  - human
  - codex
  - claude_code
  - llm_agent
