proposal_id: 20260710-gladunrv-docs-reviews-shard-policy
title: "docs/reviews/ shard-forward policy (freeze legacy flat root, new reviews into by-domain subfolders)"
status: PROPOSED
type: repository_hardening
priority: medium

proposed_by:
  contributor_id: gladunrv
  agent_id: claude

strategy_alignment:
  - "Acts on the 2026-07-09 architecture-audit finding that docs/reviews/ is a flat append-forever directory (~5 files/day) with no grouping or archival policy."
  - "Executes the design docs/reviews/README.md already pre-blessed ('preferred future grouping is by topic subfolder ... do not start a bulk migration until a link audit proves it is safe'); the required link audit is done and is recorded in this proposal."
  - "Reference-safe and merge-queue-aware: sequenced so no single PR breaks CI or the live merge queue (main merge queue active since 2026-07-10)."

summary: >
  RECOMMENDED = shard-forward: FREEZE the legacy flat root (leave all ~483
  existing docs/reviews/*.md files exactly where they are - they are public
  provenance surface referenced by ~1160 files) and route only NEW review notes
  into by-domain subfolders (docs/reviews/<domain>/: nuclear/, atomic/, quantum/,
  exoplanet/, materials/, stellar/, textbook/, frb/, thermoml/, dimensional/,
  particle/, workflow/, release/, cross-campaign/). This fixes the actual
  problem (the frozen root stays well under GitHub's ~1000-file listing ceiling
  forever) with ZERO reference churn and zero provenance risk. Two things are
  mandatory even for shard-forward: flip the two NON-recursive review
  enumerators to rglob (else new sharded reviews silently vanish from
  conveyor/curator reports), and make navigation tooling recursive. Do NOT
  commit any static/generated index; do NOT bulk-move the legacy files (that
  physical migration is optional, later, and only via a separate audited PR
  using the link-audit constraints recorded below). Convergent recommendation of
  two independent architect reviews (claude + codex).

rationale: >
  SEVERITY: hygiene, not urgent. The "~1000 files" ceiling is purely a
  github.com web-UI / contents-API listing truncation; git clone, checkout,
  grep, and CI read the flat directory fine today and would at 2000 files. Be
  honest about what NO reorg fixes: validate-repo --strict already reads every
  review file's contents on every PR (~15s, scales with file COUNT, not folder
  layout), so this is a github.com-browsability + commit-log-noise fix, not a
  CI-perf win. WHY SHARD-FORWARD (not move-now): the flat root is a public
  provenance surface with a large path-based reference graph (~551 task YAMLs,
  ~66 CI-checked campaign/result links, 166 intra-review links - see the link
  audit below). Physically moving ~483 files would force an atomic rewrite of
  all of that against a live merge queue - high churn and real provenance risk -
  to solve a hygiene problem. FREEZING the root instead caps it below the
  ceiling forever (new files go into subdirs) with zero reference churn, and it
  is exactly docs/reviews/README.md's stated preference plus the safest option
  from the link audit. Two independent architect reviews (claude + codex)
  converged on this. The ONLY mandatory code change is flipping the two
  non-recursive review enumerators to rglob (freeze-forward still breaks them,
  since new reviews land in subdirs). Do NOT commit a generated index; do NOT
  introduce a REVIEW-XXXX id registry (over-engineering; refs are 100%
  path-based). The physical bulk migration remains available later as an
  optional, separately-audited PR governed by the link-audit constraints, but is
  NOT recommended as the default.

input:
  mode: planning_only
  related_domain: repository_architecture
  related_objects:
    - "docs/reviews/README.md"
    - "docs/reviews/static-agent-facing-generated-index-postmortem.md"
    - "physics_lab/registry/docs_links.py"
    - "physics_lab/registry/science_output_conveyor.py"
    - "physics_lab/registry/campaign_curator.py"
    - "AGENTS.md"
  planning_context: >
    LINK AUDIT (the reason this can proceed safely). Reviews have NO stable id;
    every inbound reference is a raw path. ~1160 files repo-wide mention
    docs/reviews; ~495 distinct review paths are referenced. The reference graph
    splits into three break classes an executor MUST handle:
    (1) CI-HARD-FAIL - exactly ~66 distinct review targets are linked from 10
    files under docs/campaigns/ and docs/results/ via the ../reviews/X.md form.
    Those two dirs are the only surfaces find_docs_link_issues scans
    (DOCS_LINK_SURFACES in docs_links.py), and it resolves links relative to the
    SOURCE file's parent. Moving any of these 66 without rewriting the link in
    the SAME commit turns validate-repo --strict RED. The correct rewrite is
    ../reviews/<domain>/X.md (still source-relative; NOT root-absolute).
    (2) SILENT breakage (no CI error) - science_output_conveyor.py:379 and
    campaign_curator.py:786 enumerate reviews with a NON-recursive glob('*.md');
    sharded files vanish from conveyor/curator reports with no error unless both
    are flipped to rglob. ~10 scripts also carry hardcoded review-path
    constants. Intra-review cross-links are 166 same-dir occurrences (57 ./X.md
    + 109 bare, ZERO parent-form); domain sharding co-locates same-domain
    linkers automatically, but the cross-domain maintainer-decision-day hub
    (12-file fan-in) must be pinned to workflow/ with its linkers, or its ./X.md
    links dangle (and today those are NOT CI-checked, so it breaks silently).
    (3) STALE-but-not-CI-failing - ~551 task YAMLs reference review paths under
    input.related_objects / result_artifact_policy.evidence / accepted_outputs.
    No validator stats these, so they do not fail CI; they go stale and should
    be fixed by a scripted sed pass in a SEPARATE follow-up PR so the move diff
    stays reviewable.
    TAXONOMY: filenames already carry clean domain prefixes (nuclear 87, atomic
    51, quantum 51, exoplanet 48, materials 43, stellar 25, nmd0003 24 = nuclear
    mass, textbook 20, frb 15, thermoml 11, dimensional 11, particle 5). Use a
    SEMANTIC classifier with fold rules (~52 files carry a secondary token:
    autonomous-nuclear-*, claim-0007-particle-*, post-ame2020-nuclear-*,
    nmd0003=nuclear-mass) - a naive `git mv <prefix>*` misfiles them. Split the
    biggest bucket at migration time (nuclear/ + nuclear/nmd0003/) to keep it
    scannable. Handle the 3 non-.md files too.
    POLICY: navigation = directory structure + hand-written per-subfolder README
    topic stubs + on-demand CLI stdout. Do NOT commit an INDEX.md / manifest /
    generated listing - that is the forbidden volatile agent-facing second-board
    class (AGENTS.md 253-258 + static-agent-facing-generated-index-postmortem).

requirements:
  # --- RECOMMENDED path: shard-forward (freeze legacy, shard new) ---
  - "FREEZE the legacy flat root: do NOT move, rename, or delete any existing docs/reviews/*.md; they stay at their current paths so the ~1160 inbound references and CI link checks keep resolving. Only NEW review notes are created under docs/reviews/<domain>/."
  - "MANDATORY rglob: flip the two non-recursive review enumerators (science_output_conveyor.py:379, campaign_curator.py:786) from glob('*.md') to rglob('*.md') (behavior-preserving on the still-flat tree). Without this, new sharded reviews silently vanish from conveyor/curator reports. Any inventory/navigation/link-check tooling that enumerates reviews must likewise be recursive."
  - "Enforcement guard is DIFF-BASED, not a frozen list: a check fails when a NEW file is added to the docs/reviews/ root (vs the merge-base); existing root files are grandfathered by their presence. Do NOT commit an allowlist/manifest of the ~483 legacy filenames (that recreates the forbidden frozen-state / committed-index artifact)."
  - "Navigation = directory structure + hand-written per-subfolder README topic stubs + an on-demand read-only CLI that prints inventory to stdout. Do NOT commit any generated/rolling INDEX.md or manifest (AGENTS.md 253-258 + static-agent-facing-generated-index postmortem)."
  - "Archive is LOGICAL, not physical: when a legacy note is superseded, add a short 'Status: superseded by docs/reviews/...' header in place; do NOT move it into an archive/ subdir as routine (that breaks the provenance trail). Physical archival is reserved for clearly deprecated workflow/infra docs and only via a separate audited PR."
  - "Do NOT introduce a REVIEW-XXXX id registry now (refs are 100% path-based; over-engineering); do NOT justify the change as a CI/scan-cost win (it is a github.com-browsability + commit-log-noise fix)."
  # --- OPTIONAL later: physical bulk migration (only if a maintainer decides) ---
  - "IF a physical bulk move is ever done (optional, later, separate audited PR): it must be atomic - in the same commit rewrite the ~66 ../reviews/X.md links in docs/campaigns + docs/results to ../reviews/<domain>/X.md (source-relative, not root-absolute), use a scripted SEMANTIC classifier (fold rules for the ~52 secondary-token files; split nuclear/ + nuclear/nmd0003/), pin the maintainer-decision-day 12-file cross-domain hub + its linkers together, pure git mv (no content edits), and keep the ~551 stale task-yaml ref rewrite in a separate follow-up PR. Partial moves turn CI red or silently drop files."

accepted_outputs:
  - "RECOMMENDED immediate work (one small, low-risk canonical task): (a) flip the two enumerators glob->rglob; (b) update docs/reviews/README.md with the shard-forward cutover policy + shard map + logical-archive rule; (c) update docs/repository-map.md and docs/agent-task-protocol.md to permit docs/reviews/<shard>/ paths; (d) add a read-only inventory CLI (stdout, no committed output); (e) add the diff-based root-guard check + test (new flat-root reviews rejected, existing grandfathered). Verify green on tests/test_docs_links.py and validate-repo --strict."
  - "OPTIONAL later work (only on explicit maintainer decision): a separately-audited physical bulk migration of the legacy files, governed verbatim by the link-audit constraints in planning_context/requirements. Not recommended as default."
  - "Maintainer decision on scheme: shard-forward (RECOMMENDED, this proposal) vs physical move-now vs CLI-only stopgap. Both independent architect reviews (claude + codex) recommend shard-forward."

validation:
  commands:
    - "python3 -m physics_lab.cli validate-repo ."
    - "python3 -m physics_lab.cli validate-repo . --strict --fail-on-warnings"

promotion:
  canonical_task_id: null
  decision: pending
  notes: "Recommended: shard-forward (freeze legacy, shard new). The immediate small PR (rglob flip + README/repository-map/agent-task-protocol policy updates + read-only inventory CLI + diff-based root-guard) is low-risk and ready to assign a canonical task id. Physical bulk migration is optional/later and NOT recommended as default. Convergent recommendation of two independent architect reviews (claude + codex)."
