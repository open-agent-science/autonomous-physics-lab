id: TASK-1045
title: "Replay Stellar RESULT-0022 with an independent human contributor"
type: scientific_replay_validation
status: DONE
closeout: review
closeout_review_reason: "This task strengthens the trust tier of the controlled DEBCat baseline and must preserve the fitted relation, controls, metrics, verdict, and range limits."
difficulty: medium
priority: high

strategy_alignment:
  - "RESULT-0022 is AGENT_VALIDATED, but its recorded Gate B identity is same_owner_different_account."
  - "Independent-human reproducibility of the frozen stellar baseline matters before CHARA or Gaia is used as a new transfer surface."
  - "The task validates the existing bounded benchmark; it does not broaden the textbook formula conclusion."

input:
  mode: workflow
  related_domain: stellar_astrophysics
  related_objects:
    - "results/EXP-0015/RUN-0001/result.yaml"
    - "results/EXP-0015/RUN-0001/review_summary.md"
    - "docs/reviews/stellar-ml-result0022-gate-b-replay.md"
    - "docs/campaigns/textbook-formula-audit.md"
  planning_context: >
    Re-run the frozen RESULT-0022 workflow under an independent human identity.
    Confirm deterministic metrics and the narrow conclusion that alpha=3.5 is
    inadequate as the sole baseline on this DEBCat slice, not universally
    falsified.

requirements:
  - "Reserved for a contributor controlled by a different human from the owner of gladunrv and romanhladun24-dot; same-human execution must stop with INDEPENDENCE_BLOCKED."
  - "Record contributor id, GitHub username, agent/tool, model/version, operating system, replay command, output directory, tolerance, metric count, and maximum absolute drift."
  - "Run the committed RESULT-0022 command and Gate B comparison without changing rows, split, alpha candidates, fitted alpha, null, thresholds, metrics, best_model_id, or best_verdict."
  - "On PASS, append schema-permitted replay metadata so the strongest validation_independence becomes independent; preserve prior replay history."
  - "On drift or command failure, record a blocker and leave RESULT-0022 metadata, tier, and public wording unchanged."
  - "Do not inspect CHARA or Gaia values, tune the relation, create a transfer result, promote a claim, or use universal mass-luminosity wording."
  - "Return exactly one verdict: INDEPENDENT_GATE_B_PASS, INDEPENDENCE_BLOCKED, or GATE_B_FAIL_METRIC_DRIFT."
  - "No-claim wording: the replay concerns one frozen DEBCat benchmark slice and does not falsify a universal textbook relation."

accepted_outputs:
  - "An independent replay note under docs/reviews/stellar/ plus the minimal RESULT-0022 review-metadata update only on PASS."
  - "Output-routing summary: replay-validation evidence only; no metric, verdict, claim, prediction, or knowledge change."

result_artifact_policy:
  required: false
  reason: "Replay validation of an existing result; no new result is produced."
  evidence:
    - "results/EXP-0015/RUN-0001/result.yaml"

validation:
  commands:
    - "python3 -m pytest tests/test_stellar_ml_debcat_baseline_result.py tests/test_docs_links.py"
    - "python3 -m physics_lab.cli validate-repo . --strict --fail-on-warnings"
    - "python3 scripts/check_docs_reviews_shard_policy.py --base origin/main --head HEAD"

can_be_done_by:
  - human
  - codex
  - claude_code
  - llm_agent
