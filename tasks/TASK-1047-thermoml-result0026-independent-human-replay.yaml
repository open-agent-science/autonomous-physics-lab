id: TASK-1047
title: "Replay ThermoML RESULT-0026 with an independent human contributor"
type: scientific_replay_validation
status: DONE
closeout: review
closeout_review_reason: "This task strengthens the trust evidence of the bounded ThermoML benchmark and must preserve the paired failed-family memory and all source/rights limits."
difficulty: medium
priority: high

strategy_alignment:
  - "RESULT-0026 is AGENT_VALIDATED, but its recorded replay identity is same_owner_different_account; RESULT-0028 already has independent-human negative-memory replay."
  - "Independent-human replay of the positive aggregate benchmark balances the campaign's trust evidence without reopening the stopped exact-80 expansion."
  - "A pass validates deterministic reproduction only and must remain paired with the esters/lactones failure."

input:
  mode: workflow
  related_domain: thermophysical_property_estimation
  related_objects:
