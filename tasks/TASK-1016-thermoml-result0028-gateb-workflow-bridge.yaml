    scientific metrics exactly.

requirements:
  - "Implement a Gate-B-safe workflow or supported command path for RESULT-0028 using committed inputs only."
  - "Update RESULT-0028 command/code_reference metadata only if the new command reproduces the existing metrics byte-for-byte or within the documented tolerance."
