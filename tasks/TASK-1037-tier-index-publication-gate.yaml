id: TASK-1037
title: "Make the scientific-memory review-tier index a checked publication gate"
type: infrastructure
status: REVIEW_READY
closeout: review
closeout_review_reason: "This changes a public evidence surface and two CI workflows; closeout must confirm the index regenerates post-merge and the nightly drift alarm is live."
difficulty: medium
priority: high

strategy_alignment:
  - "The committed docs/scientific-memory-review-tiers.md had drifted from canonical artifacts (it still showed one AGENT_VALIDATED result while fifteen exist), so the public review-tier surface understated the lab's own evidence state."
  - "Before any external-facing use of the index, tier freshness must be mechanical, not manual: regenerated post-merge, alarmed nightly, and checkable with one command."
  - "Review tier and replay independence are separate axes; showing validation_independence per replayed result prevents same-owner replays from being read as independent validation."

input:
  mode: workflow
  related_objects:
    - "physics_lab/registry/scientific_memory_index.py"
    - "scripts/apl_scientific_memory_index.py"
    - "docs/scientific-memory-review-tiers.md"
    - "docs/historical-scientific-memory.md"
    - "policy/pre-tier-artifact-allowlist.yaml"
    - ".github/workflows/sync-active-board.yml"
    - ".github/workflows/nightly-full-repo.yml"
    - "docs/public-release-gates.md"
  planning_context: >
    Add a --check mode (exit 0 in sync, exit 1 stale with a --write
    instruction) to the index CLI, surface validation_independence for RESULT
    rows (not_recorded fallback for replayed results that predate the axis),
    regenerate the committed index, wire regeneration into the post-merge
    board sync and the freshness check into the nightly watchdog, and record
    both conditions in Gate 4 of the public-release gates.

requirements:
  - "scripts/apl_scientific_memory_index.py gains a --check mode: exit 0 when the committed index is byte-identical to a fresh render, exit 1 with a regeneration instruction otherwise."
  - "The rendered index shows a validation-independence column sourced from agent_proposal_evaluation.validation_record.validation_independence; replayed tiers without a record show not_recorded, unreplayed artifacts show n/a."
  - "docs/scientific-memory-review-tiers.md is regenerated in this PR and byte-synchronized at merge time."
  - "sync-active-board.yml regenerates the index post-merge (trigger paths extended to results/, claims/, prediction_registry/, knowledge/) and stages it under the existing diff allowlist."
  - "nightly-full-repo.yml runs the --check as a drift alarm; the check is deliberately NOT added to the PR lane or merge queue, because pre-merge byte-sync would force every scientific PR to regenerate the shared index in-branch and reintroduce the parallel-PR merge-conflict problem the post-merge sync pattern exists to avoid."
  - "docs/public-release-gates.md Gate 4 requires the --check to pass and the independence axis to be visible before public narrative use."
  - "The public trust ladder shows only the four real review tiers; artifacts without review_tier are classified PRE_TIER_PROTOCOL (historical), summarized compactly on the index with counts by class, and listed in full in a generated docs/historical-scientific-memory.md ledger — no retroactive tier backfill, no hidden history."
  - "A frozen policy/pre-tier-artifact-allowlist.yaml grandfathers existing untiered artifacts; a PR-lane test fails when a new canonical artifact lacks an explicit review_tier, so the historical pool can only shrink."
  - "Tests are hermetic (tmp-path artifact fixtures) and assert renderer and gate behavior without hardcoding live-repo artifact counts; the only live-repo assertion is the untiered-artifact guard against the frozen allowlist."

accepted_outputs:
  - "Updated physics_lab/registry/scientific_memory_index.py and scripts/apl_scientific_memory_index.py"
  - "Regenerated docs/scientific-memory-review-tiers.md with the Independence column and a four-tier trust ladder"
  - "Generated historical ledger docs/historical-scientific-memory.md"
  - "Frozen allowlist policy/pre-tier-artifact-allowlist.yaml with the new-artifact review_tier guard"
  - "Workflow updates in .github/workflows/sync-active-board.yml and .github/workflows/nightly-full-repo.yml"
  - "Gate 4 additions in docs/public-release-gates.md"
  - "Hermetic gate tests in tests/test_scientific_memory_index_gate.py"

result_artifact_policy:
  required: false
  reason: "Infrastructure and public-surface synchronization; no scientific RESULT, PRED, or dataset rows are created."
  evidence:
    - "docs/scientific-memory-review-tiers.md"

validation:
  commands:
    - "python3 scripts/apl_scientific_memory_index.py --check"
    - "python3 -m pytest tests/test_scientific_memory_index_gate.py tests/test_docs_links.py"
    - "python3 -m physics_lab.cli validate-repo . --strict --fail-on-warnings"
    - "git diff --check"

can_be_done_by:
  - human
  - claude_code
  - codex
  - llm_agent
