reveal_conditions:
  reveal_trigger: The next AME/NUBASE-class evaluation published after this registration, or a qualifying
    flagged Penning-trap / storage-ring measurement subset in a watched frontier region, admitted
    under docs/nuclear-prediction-reveal-protocol.md with its own source manifest, checksum record,
    registry snapshot, and no-peek audit by a separate maintainer-reviewed reveal task.
  comparison_data_reference: Future pinned source manifest per docs/nuclear-prediction-reveal-protocol.md
    and docs/nuclear-reveal-source-readiness-checklist.md. Tier-1 reveal metrics are MAE (MeV) and
    rank against the frozen baseline set (PRED-0069, PRED-0070, PRED-0071, PRED-0072) ONLY, per region
    and pooled; no interval coverage, sharpness, or calibration metric is in scope. If the pinned
    source reports mass excess or atomic mass, the conversion to binding energy must be the deterministic
    committed convention in physics_lab/engines/nuclear_masses.py and be documented by the reveal
    task.
  reveal_owner: maintainer or maintainer-authorized review agent
  no_peek_rule: Do not alter model family, frozen parameters, target nuclides, prediction values,
    source commit, or reveal rule after later measurements become visible. Later comparison must be
    a separate reviewed reveal task and may reveal only eligible measured subsets; unrevealed targets
    stay unchanged under partial reveal. Any future tier-2 upgrade adds intervals as an additive amendment
    bound to these already-frozen central values, only after fresh-surface calibration validation
    per the TASK-0925 contract, without re-freezing or re-timing the points.
