# Nightly full_repo watchdog.
#
# The PR CI fast lane skips full_repo, and the risk-based PR gate
# (ci.yml -> full_repo_risk) runs it only for risk-relevant PRs. This nightly
# job runs the full_repo smoke tests plus strict validation and the core example
# replays on main, so anything that slips past the PR gate (a flaky test, a
# dependency drift, or a main-only interaction) is caught within a day rather
# than surfacing on an unrelated PR. A failure here means main is not
# full_repo-clean and safe auto-closeout should fall back to report-only.

name: Nightly full_repo watchdog

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-repo
  cancel-in-progress: false

jobs:
  full-repo:
    name: full_repo smoke + strict validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Full-suite 3.12 safety net: the per-merge 3.12 matrix leg was removed
      # (the squash-merged tree passes the identical suite at PR time), so the
      # nightly now owns whole-suite 3.12 coverage of main.
      - name: Run full test suite (fast-lane scope)
        run: |
          python -m pytest --durations=15 -n auto --dist loadgroup -m "not full_repo"

      - name: Run full_repo smoke tests
        run: |
          # Parallel: a serial (-n0) attempt was 5-7x slower on CI hardware
          # than the contended parallel run; the explicit 300 s per-test
          # timeout (vs the 60 s global default) absorbs contention-inflated
          # test times, which is what actually broke this job on 2026-07-08.
          python -m pytest --durations=20 --timeout=300 -m full_repo

      - name: Strict validate repository artifacts
        run: |
          python -m physics_lab.cli validate-repo . --strict --fail-on-warnings

      # Drift alarm only: the post-merge board sync regenerates the index, so
      # a failure here means a merge path bypassed that sync and the public
      # review-tier surface no longer matches canonical artifacts.
      - name: Check scientific-memory review-tier index freshness
        run: |
          python scripts/apl_scientific_memory_index.py --check

      - name: Core example replays
        run: |
          python -m physics_lab.cli run examples/pendulum.yaml --output-dir "${RUNNER_TEMP}/apl-pendulum"
          python -m physics_lab.cli run examples/damped_oscillator.yaml --output-dir "${RUNNER_TEMP}/apl-damped"

      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Nightly full_repo watchdog FAILED"
            echo ""
            echo "main is not full_repo-clean. Safe auto-closeout should fall back"
            echo "to report-only until this is green. Inspect the failing step above."
          } >> "$GITHUB_STEP_SUMMARY"
