# Automated dependency updates.
#
# Two ecosystems:
#
# - github-actions: keeps the SHA-pinned actions in .github/workflows/*.yml
#   current. TASK-0969 pinned every action to a commit SHA (with a trailing
#   version comment) so a repointed upstream tag cannot inject code; Dependabot
#   is what then bumps those pins to new upstream releases, so pinning does not
#   mean the actions silently rot.
# - pip: monitors the direct Python dependencies declared in pyproject.toml.
#   The project floors its deps with >= and ships no lockfile, so transitive
#   dependency drift still belongs to a future lockfile/constraints decision.
#
# Grouped so each ecosystem produces one consolidated PR per weekly run
# instead of one PR per dependency.
#
# rebase-strategy is "disabled" because the main ruleset uses strict required
# status checks: every push to main (merges plus post-merge board-sync commits)
# made Dependabot auto-rebase all its open PRs, re-running full CI each time
# (2026-07-09 audit: 118 PR CI runs in one day, 30 cancelled). With "disabled",
# the branch is updated once, right before its merge slot, via
# `gh pr update-branch` or an "@dependabot rebase" comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    rebase-strategy: "disabled"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
