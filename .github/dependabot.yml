# Automated dependency updates.
#
# Two ecosystems:
#
# - github-actions: keeps the SHA-pinned actions in .github/workflows/*.yml
#   current. TASK-0969 pinned every action to a commit SHA (with a trailing
#   version comment) so a repointed upstream tag cannot inject code; Dependabot
#   is what then bumps those pins to new upstream releases, so pinning does not
#   mean the actions silently rot.
# - pip: monitors the Python dependencies declared in pyproject.toml (the
#   project floors its deps with >= and ships no lockfile) so a drifted or
#   yanked transitive release surfaces as a reviewable PR rather than only
#   appearing on the next CI install.
#
# Grouped so each ecosystem produces one consolidated PR per weekly run
# instead of one PR per dependency.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
