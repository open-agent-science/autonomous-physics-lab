[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-physics-lab"
version = "0.2.0"
description = "Autonomous Physics Lab for hypothesis generation, simulation, falsification, and formula discovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.6",
    # Merge-group CI installs dev extras into a fresh environment. Ruff 0.16.0
    # changed the default lint surface and made unchanged main fail with 1752
    # findings on 2026-07-23. Keep the last green version exact-pinned; upgrade
    # the lint baseline only in a dedicated, reviewable dependency PR.
    "ruff==0.16.0",
]
thermoml = [
    "rdkit==2026.3.4",
    "thermo==0.6.1",
]

[project.scripts]
physics-lab = "physics_lab.cli:app"

[tool.setuptools.packages.find]
include = ["physics_lab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 60
# Parallel by default with pytest-xdist (a dev dependency co-installed with
# pytest), matching CI. `--dist loadgroup` keeps declared resource-sensitive
# groups on one worker while preserving parallel execution for the rest of the
# suite. Override with `-n0` to run serially (e.g. for a single-test debug).
# See TASK-0501 and TASK-0523.
addopts = "-p no:cacheprovider -n auto --dist loadgroup"
markers = [
    "full_repo: slow full-repository smoke checks kept for main/nightly/full validation runs",
    "resource_sensitive: measured high-memory tests isolated by the Windows fast lane",
]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
relative_files = true
source = ["physics_lab", "scripts"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit\\(main\\(\\)",
]
