id: EXP-PROPOSAL-0085
title: "Run the AHS common-scheme geometric-midpoint baseline"
campaign_profile_id: particle-mass-relations
proposal_kind: audit
status: REVIEW_READY
claim_ceiling: "Sandbox descriptive benchmark only; no canonical result, formula law, BSM interpretation, claim, or knowledge artifact."
