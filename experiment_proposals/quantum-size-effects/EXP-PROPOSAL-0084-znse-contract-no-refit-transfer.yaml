question: "Executed exactly as frozen by TASK-0914 (rows, harmonization, model family, controls, threshold), does the InP-calibrated confinement power law conf = C*d^(-n) predict the held-out ZnSe direct-size confinement (E1s - E_bulk) better than per-material-mean and shuffled-size controls by at least the frozen 0.05 eV margin, with no refit on the holdout?"
method:
  summary: "Verify the frozen contract (exact row ids, equal-volume factor 0.608291447, bulk gaps 1.34/2.70 eV, seed 842, 0.05 eV margin) against the engine constants and committed datasets before any metric is computed, then run the committed TASK-0842 transfer engine unchanged through an exact workflow wrapper: calibrate conf = C*d^(-n) on the six InP rows using the confinement term, freeze C and n, predict the ten held-out ZnSe rows on the equal-volume diameter axis (primary judge), run per-material-mean and deterministic shuffled-size controls, and route the outcome per the frozen survival rule; report the reverse direction and the characteristic-length framing as secondary diagnostics only."
  code_references:
    - "physics_lab/engines/quantum_cross_material_transfer.py"
    - "scripts/run_quantum_znse_contract_transfer.py"
  commands:
    - "python3 scripts/run_quantum_znse_contract_transfer.py --write"
  parameters:
    contract_task_id: TASK-0914
    primary_direction: forward_inp_to_znse
    primary_framing: equivalent_diameter
    required_margin_ev: 0.05
    shuffle_seed: 842
    bulk_gap_inp_ev: 1.34
    bulk_gap_znse_ev: 2.70
    tetra_edge_to_equiv_diameter_factor: 0.608291447
    property_kind: absorption_peak_eV
inputs:
  datasets:
    - "data/quantum_dots/qd-0003-almeida-2023-inp-optical.yaml"
    - "data/quantum_dots/qd-0004-toufanian-2021-znse-absorption.yaml"
  constants:
    - "InP bulk gap 1.34 eV (fixed contract input)."
    - "ZnSe bulk gap 2.70 eV (fixed contract input)."
    - "Tetrahedron edge -> equal-volume sphere diameter factor 0.608291447 (frozen by the contract)."
  prior_results: []
  assumptions:
    - "Only the contract-frozen direct-size rows enter the judge; calibration-derived CdSe/PbS sets are excluded."
    - "C and n are frozen from the calibration material; the holdout is never used to fit."
    - "Bulk gaps are fixed inputs, not fitted to the holdout."
    - "Any drift from the frozen contract stops the run before metrics are inspected."
outputs:
  sandbox_output_paths:
    - "agent_runs/AGENT-RUN-0090/"
  metrics:
    - "transferred-model and control confinement MAE/RMSE per direction and framing"
    - "transfer margin vs best control and the frozen-margin contract outcome"
    - "frozen confinement coefficient and exponent per calibration material"
    - "per-row ZnSe holdout residuals"
  plots: []
  notes:
    - "docs/reviews/quantum-znse-contract-transfer-benchmark.md"
validation:
  pass_condition: "The frozen contract verification passes before the run, all frozen models, controls, residual tables, and deterministic checks are present, and the contract outcome is computed from the frozen 0.05 eV rule without relaxation."
  fail_condition: "Any contract drift (rows, factor, bulk gaps, seed, threshold), property mixing, holdout leakage, refit-on-holdout, correction search, post-hoc threshold change, absolute-energy fallback, nondeterminism, calibration-derived-row inclusion, or canonical artifact write fails the experiment."
  baseline_or_reference: "Per-material-mean null and deterministic shuffled-size control on the held-out material."
  expected_failure_modes:
    - "Confinement scaling is material-specific and does not transfer under the frozen margin."
    - "The transferred model beats the controls but lands under the frozen margin (borderline inconclusive memory)."
    - "Small per-material samples make the borderline margin unstable."
overclaim_risk:
  public_claim_allowed: false
  forbidden_language:
    - "No discovery, universal law, design law, material recommendation, synthesis guidance, device claim, biomedical wording, or independent validation wording."
    - "A cleared margin would be bounded two-material evidence, not a universal law."
  mitigations:
    - "Sandbox-only routing."
    - "Contract verified before metrics; margin never relaxed after reveal."
    - "Two-material, confinement-term, direct-size-only, bulk-gap-input limitations stated in every summary."
limitations:
  - "Two materials, one source and morphology per material, six InP and ten ZnSe rows."
  - "Confinement-term framing with fixed bulk gaps and the frozen equal-volume edge->diameter conversion."
  - "No claim, result, prediction, or knowledge promotion."
verdict: REVIEW_NEEDED
maintainer_decision_requested: "Review contract fidelity (frozen rows, harmonization, controls, threshold verified pre-run) and the borderline FAIL_TO_CLEAR outcome routed as inconclusive/borderline memory per the frozen rule."
