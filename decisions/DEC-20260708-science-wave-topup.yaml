  strongest_objection: >-
    As originally drafted, the wave PR bundled a Class 2 data-rights
    decision (agent-ticked Option A checkbox with merge-as-signature)
    inside a composite 10-file diff, with the decision stub cited but not
    yet existing - a governance smell the dry-run policy exists to prevent.
    Secondary: TASK-0961 authorized agent-side KNOW creation
    (maintainer-only per Gate C); 0957/0959/0960 needed an execution
    ordering; predeclaration vocabulary overstated enforceability.
  why_rejected: >-
    Not rejected - CURED before merge, exactly as the advocate proposed:
    the Option A tick was reverted out of this PR and travels in its own
    dedicated maintainer PR with its Class 2 stub; TASK-0961 was rescoped
    to draft proposals for maintainer adoption; TASK-0960 gained the
    execute-last ordering; TASK-0957's authorization wording was corrected
    to the general Gate A rule; TASK-0958's predeclaration wording now
    names itself a procedural convention; the wave memo gained throttle
    evidence pointers. The advocate explicitly judged the 8-task top-up
    itself not blocked (cadence ~10 merges/day, band respected, akutenyov
    reservations honored).
