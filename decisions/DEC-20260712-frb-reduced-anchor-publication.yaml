basis:
  - "TASK-1021 rights review: docs/reviews/frb/frb-anchor-zenodo-rights-publication-review.md"
  - "The existing nine-member GitHub Release capsule includes source-derived value-bearing CHIME/FRB-linked score, rank, feature, and model surfaces and is not cleared for blanket external redistribution or licensing."
  - "The reduced route preserves a third-party timestamp by publishing APL-authored metadata plus checksums, byte sizes, commits, tags, and public repository pointers for excluded sealed members."
  - "The maintainer explicitly selected GO_REDUCED_CAPSULE in the Codex conversation on 2026-07-12."

agent_quorum:
  director_agent:
    vote: approve
    agent_id: scientific-campaign-director
    vendor: openai
    agent_tool: Codex
    model_version: GPT-5
    session_id: codex-director-20260712-go-reduced-capsule
  cross_vendor: false

devils_advocate:
  alternative_considered: >-
    Keep the GitHub tag and Release as the only anchor until every member of
    the full nine-file capsule receives a separate redistribution and license
    determination.
  strongest_objection: >-
    A Zenodo record may still be misread as licensing or redistributing the
    excluded CHIME/FRB-derived prediction surfaces, even when the archive
    contains only APL-authored metadata and their checksums.
  why_rejected: >-
    The approved route excludes all source-derived value-bearing members,
    forbids reusable-dataset and blanket-license framing, requires a generated
    allowlist plus an excluded-member checksum manifest, and reserves the
    upload and publish action for the maintainer. This preserves the stronger
    third-party timestamp without asserting rights over the excluded bytes.
  escalation_required: false

