devils_advocate:
  alternative_considered: >-
    Apply a default downgrade or removal for collaborators inferred from old
    PR authorship, branch names, or visible public activity.
  strongest_objection: >-
    Direct collaborator roles are private repo-settings evidence. Inferring
    permissions or intent from public activity would risk removing useful
    access, misidentifying a contributor, or documenting false role data in a
    public scientific repository.
  why_rejected: >-
    The safe packet records read-only maintainer commands and a no-change
    default until the private collaborator API evidence is collected by an
    authorized maintainer. That preserves least-privilege review without
    inventing data.
