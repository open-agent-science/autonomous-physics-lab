alias_lookup_identity:
  service: SIMBAD TAP (synchronous)
  service_url: https://simbad.cds.unistra.fr/simbad/sim-tap/sync
  access_date_utc: '2026-07-13'
  response_format: text
  alias_query_template: SELECT id2.id AS alias_id FROM ident AS id1 JOIN ident AS id2 USING(oidref) WHERE
    id1.id = '<queried-id>' ORDER BY alias_id
  hierarchy_query_template: SELECT b1.main_id AS parent_id, b2.main_id AS child_id, h.membership FROM
    h_link AS h JOIN basic AS b1 ON b1.oid=h.parent JOIN basic AS b2 ON b2.oid=h.child WHERE h.parent
    IN (SELECT oidref FROM ident WHERE id='<queried-id>') OR h.child IN (SELECT oidref FROM ident WHERE
    id='<queried-id>') ORDER BY parent_id, child_id
  main_id_query: SELECT id.id AS queried_id, b.main_id, b.oid FROM ident AS id JOIN basic AS b ON b.oid=id.oidref
    WHERE id.id IN ('HD 8374','HD 24546','HD 61859','HD 89822','HD 109510','HD 191692','HD 27483','HD
    283882','HD 26874','HD 27149','HD 30676','HD 28545','HD 284163') ORDER BY main_id
  raw_responses_committed: false
  raw_response_digest_algorithm: sha256
  acknowledgement: This audit made use of the SIMBAD database, operated at CDS, Strasbourg, France (Wenger
    et al. 2000, A&AS 143, 9). Recorded content is limited to object identifiers and hierarchy links (facts),
    with per-response SHA-256 digests.
