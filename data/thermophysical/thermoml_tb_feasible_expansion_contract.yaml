verdict: REVISED_CONTRACT_READY_NO_SCORE

adjudication_boundary:
  archive_accessed: false
  fixture_rows_accessed: false
  selected_identities_accessed: false
  scientific_values_accessed: false
  result_artifacts_accessed: false
  family_performance_used_in_option_selection: false
  incidental_repository_search_snippets_excluded: true
  allowed_inputs:
    - committed_aggregate_identity_counts
    - existing_40_row_fixture_shape
    - pre_existing_eight_family_taxonomy
    - committed_rights_decision_scope
    - frozen_selection_and_benchmark_protocols

source:
  product: NIST_TRC_ThermoML_Archive
  doi: 10.18434/mds2-2422
  version: "1.2.6"
  archive_filename: ThermoML.v2020-09-30.tgz
  archive_size_bytes: 189433115
  archive_sha256: 231161b5e443dc1ae0e5da8429d86a88474cb722016e5b790817bb31c58d7ec2
  live_external_fetch_allowed: false
  exact_local_archive_required: true

rights:
  decision_record: decisions/DEC-20260708-thermoml-option-a.yaml
  approved_scope_available: true
  execution_application_status: pending_later_task
  reuse_status: limited_factual_extract_with_attribution
  covered_by_repo_license: false
  max_public_rows_total: 80
  max_rows_per_source_article: 5
  raw_archive_bytes_allowed: false
  extracted_xml_json_allowed: false
  normalized_corpus_allowed: false
  external_dataset_release_allowed: false
  zenodo_release_allowed: false

existing_surface:
