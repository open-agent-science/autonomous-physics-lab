dataset_id: qd-0006-kim-2020-cdse-emission
title: "Kim 2020 CdSe text-reported fluorescence peaks"
status: curated
description: >
  Four source-reported CdSe fluorescence-peak observations transcribed from
  the body paragraph immediately before Figure 3 in Kim et al. 2020. The
  source term fluorescence is mapped to the canonical emission_peak_eV axis
  and is kept separate from absorption. No model fitting or scoring is included.
source_policy: >
  DOI 10.3390/nano10081589, CC BY 4.0. Values follow the frozen TASK-1064
  text-reported route contract. Version-of-record PDF SHA-256
  2dab8a6b4db18af88f7175ac0773747fe1aeb15d88f951a4a8536cdc2dd73edb;
  Europe PMC JATS SHA-256
  6642fed609ad6540b61ca856d293d2b469c5ed7be9323479c9b76b023f668244.
  The source files are not vendored. Printed precision is 0.01 eV, so 0.005 eV
  is recorded only as a rounding floor; instrument uncertainty is not reported.
property_kind_covered: emission_peak_eV
