dataset_id: qd-0005-kim-2020-cdse-absorption
title: "Kim 2020 CdSe text-reported absorption peaks"
status: curated
description: >
  Four source-reported CdSe absorption-peak observations transcribed from the
  body paragraph immediately before Figure 3 in Kim et al. 2020. The particle
  sizes and peak energies are mapped by the paragraph's stated CdSe-1 through
  CdSe-4 order. These rows are factual source curation only and have not been
  fitted, scored, or interpreted as a size law.
source_policy: >
  DOI 10.3390/nano10081589, CC BY 4.0. Values follow the frozen TASK-1064
  text-reported route contract. Version-of-record PDF SHA-256
  2dab8a6b4db18af88f7175ac0773747fe1aeb15d88f951a4a8536cdc2dd73edb;
  Europe PMC JATS SHA-256
  6642fed609ad6540b61ca856d293d2b469c5ed7be9323479c9b76b023f668244.
  The source files are not vendored. Printed precision is 0.01 eV, so 0.005 eV
  is recorded only as a rounding floor; instrument uncertainty is not reported.
property_kind_covered: absorption_peak_eV
