id: HYP-PROPOSAL-0084
title: "TASK-0914 contract execution: InP->ZnSe no-refit confinement transfer"
campaign_profile_id: quantum-size-effects
proposal_kind: falsification
status: REVIEW_READY
claim_ceiling: "Sandbox contract-executed two-material transfer benchmark only; no universal size law, quantum-dot design law, material recommendation, result, claim, or knowledge promotion."
proposed_by:
  contributor_id: gladunrv
  agent_id: claude
  task_id: TASK-0920
input_references:
  - "docs/reviews/quantum-znse-no-refit-transfer-contract.md"
  - "data/quantum_dots/qd-0003-almeida-2023-inp-optical.yaml"
  - "data/quantum_dots/qd-0004-toufanian-2021-znse-absorption.yaml"
  - "docs/reviews/quantum-znse-frozen-row-transfer-readiness.md"
  - "docs/reviews/quantum-znse-cross-material-transfer-benchmark.md"
hypothesis:
  statement: "Under the transfer contract frozen by TASK-0914 before this run, a size-confinement power law conf = C*d^(-n) calibrated and frozen on the six direct InP rows predicts the ten held-out direct ZnSe rows' confinement (E1s - E_bulk) better than per-material-mean and shuffled-size controls by at least the frozen 0.05 eV margin, without refitting on the holdout."
  variables:
    - "d: transfer size axis in nm (ZnSe SAXS diameter verbatim; InP tetrahedral edge converted with the frozen equal-volume factor 0.608291447)."
    - "E1s: first absorption-peak energy in eV."
    - "E_bulk: fixed per-material bulk gap input (InP 1.34 eV; ZnSe 2.70 eV), never fitted to the holdout."
    - "conf = E1s - E_bulk: the size-confinement residual axis."
  assumptions:
    - "Only the contract-frozen rows enter the judge: the six InP TEM rows (qd-0003) and ten ZnSe SAXS rows (qd-0004), verified against the frozen row-id lists before the run."
    - "The calibration-derived Yu CdSe (qd-0001) and Moreels PbS (qd-0002) sets are excluded by the contract."
    - "Both C and n are frozen from the calibration material and applied to the holdout with no refit, no correction search, and no post-hoc threshold change."
    - "The effective-mass route (TASK-0850/TASK-0871) remains negative memory and is not rerun as a rescue."
  expected_scope: "One contract-executed two-material confinement-transfer benchmark on the frozen direct-size rows (InP calibration, ZnSe holdout as the primary judge; reverse direction and characteristic-length framing as secondary diagnostics)."
  expected_failure_modes:
    - "The transferred confinement curve fails to beat the per-material-mean null on the held-out ZnSe rows (negative memory)."
    - "The transferred model beats the best control but by less than the frozen 0.05 eV margin (inconclusive/borderline memory)."
    - "The shuffled-size control performs as well as the transferred model."
    - "The morphology/size-axis convention dominates the transfer error."
novelty_check:
  checked_files:
    - "docs/reviews/quantum-znse-no-refit-transfer-contract.md"
    - "docs/reviews/quantum-znse-cross-material-transfer-benchmark.md"
    - "docs/reviews/quantum-znse-frozen-row-transfer-readiness.md"
  possible_overlap: "TASK-0842 (AGENT-RUN-0083) ran the same engine exploratorily; this proposal is the contract-authorized execution predeclared by TASK-0914, which converts the borderline outcome into contract-executed memory rather than an exploratory observation."
  notes: "No parameter, row, threshold, or framing differs from the frozen contract; the engine is reused unchanged so metrics are expected to reproduce exactly."
falsification_plan:
  deterministic_check: "Run scripts/run_quantum_znse_contract_transfer.py --write twice and require identical metrics."
  baseline_or_reference: "Frozen confinement power law calibrated on InP; per-material-mean null and deterministic shuffled-size (seed 842) controls on the held-out ZnSe rows."
  pass_condition: "The transferred-model held-out confinement MAE beats the best control by at least the frozen 0.05 eV margin."
  fail_condition: "NEGATIVE_MEMORY if the transferred model does not beat the best control; FAIL_TO_CLEAR (inconclusive/borderline memory) if it beats controls but does not clear the frozen 0.05 eV margin; the margin is not relaxed and no refit, correction search, or absolute-energy fallback is used to rescue a borderline result."
overclaim_risk:
  public_claim_allowed: false
  forbidden_language:
    - "Do not call this a universal quantum-dot law, design law, discovery, material recommendation, or independent validation."
    - "A cleared margin would be bounded evidence of partial confinement universality across two materials, not a universal law."
  mitigations:
    - "Keep output sandbox-only."
    - "State the two-material, confinement-term, direct-size-only, bulk-gap-input limitations prominently."
    - "Execute only the TASK-0914 frozen contract; verify frozen rows and thresholds before any metric is computed and stop on any drift."
sandbox_evidence:
  commands:
    - "python3 scripts/run_quantum_znse_contract_transfer.py --write"
    - "python3 -m pytest -n0 tests/test_quantum_znse_contract_transfer.py"
  code_references:
    - "physics_lab/engines/quantum_cross_material_transfer.py"
    - "scripts/run_quantum_znse_contract_transfer.py"
  metrics:
    - "transferred-model holdout confinement MAE/RMSE per direction and framing"
    - "per-material-mean and shuffled-size control MAE"
    - "transfer margin vs best control and the frozen-margin contract outcome"
    - "frozen confinement coefficient and exponent per calibration material"
  output_paths:
    - "agent_runs/AGENT-RUN-0090/"
    - "docs/reviews/quantum-znse-contract-transfer-benchmark.md"
limitations:
  - "Two materials only (InP, ZnSe); not a universal size law."
  - "Confinement-term framing with fixed cited bulk gaps and the frozen equal-volume edge->diameter conversion."
  - "Direct-size rows only; six InP and ten ZnSe rows; one source and morphology per material."
  - "Sandbox evidence only; no canonical artifact is created."
verdict: REVIEW_NEEDED
maintainer_decision_requested: "Confirm the contract execution matched the TASK-0914 frozen parameters and accept the borderline FAIL_TO_CLEAR outcome as inconclusive/borderline memory; any strengthening (more materials, reviewed conversion policy) requires a separate maintainer-approved task and must not be back-fitted onto this holdout."
promotion_boundary:
  canonical_result_allowed: false
  claim_promotion_allowed: false
  required_next_step: "Separate maintainer-approved task for any canonical result publication, claim, or model extension."
