freeze_contract:
  exact_agreement_threshold: 0.90
  valid_recall_floor: 0.85
  invalid_recall_floor: 0.85
  inconclusive_ceiling: 0.05
  duplicate_policy: >
    Reject duplicate normalized formulas and duplicate item ids. Conceptual
    variants must change the physical quantity or dimensional failure mode and
    carry an explicit rationale.
  parser_scope_exclusions:
    - vector, tensor, derivative, and integral syntax requiring semantic operators
    - natural-unit conventions or implicit c/hbar conversions
    - affine temperature conversions and logarithms of dimensional arguments
    - piecewise, inequality, and known-limit judgments
  stop_go_routing:
    PASS: "A later role-eligible task may package exact-v2 scoring evidence."
    FAIL: "Preserve a negative result; do not tune rows or engine behavior."
    CONTAMINATED: "Invalidate the blind role and route the surface to calibration memory only."
  historical_overlap_audit:
    historical_surface: knowledge/challenge_sets/dimensional_analysis_challenge_set.yaml
    exact_duplicate_count: 0
    conceptual_near_duplicate_count: 0
    maximum_allowed_count: 16
    audit_method: >
      Manual normalized-expression and physical-identity comparison against the
      historical 74-row metadata; generic failure-mode similarity alone was not
      counted as a conceptual duplicate.
  item_order_digest_algorithm: sha256
  item_order_digest_payload: "id|formula|expected_verdict joined with LF in item order"
